[project]
name = "repo-setup"
version = "0.1.0"
description = "Dev meta-project for monorepo"
requires-python = ">=3.12,<3.15"
dependencies = ["jupyter (>=1.1.1,<2.0.0)", "sentencepiece (>=0.2.1,<0.3.0)", "transformers (>=4.57.1,<5.0.0)", "torch (>=2.9.1,<3.0.0)", "torchvision (>=0.24.1,<0.25.0)", "fastapi (>=0.121.2,<0.122.0)"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
messages-saver-service = { path = "apps/saver", develop = true }
command-service = { path = "apps/command_service", develop = true }
shared = {path = "apps/shared", develop = true}
bot-app = { path = "bot", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.4"


[tool.pytest.ini_options]
pythonpath = [
  "apps/saver/src"
]