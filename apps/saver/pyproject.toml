[project]
name = "messages-saver-service"
version = "0.1.0"
description = "v1"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.11,<3",
    "fastapi>=0.118,<0.119",
    "uvicorn[standard]>=0.37,<0.38",
    "psycopg[binary,async]>=3.2,<4.0",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
packages = [{ include = "saver_app", from = "src" }]

[tool.poetry.dependencies]
shared = { path = "../shared", develop = false }

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
ruff = "^0.13.3"
black = "^25.9.0"
mypy = "^1.18.2"
