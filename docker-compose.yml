services:
  db:
    image: postgres:16-alpine
    container_name: tgchats_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-telegram_chats}
    ports:
      - "${DB_PORT_OUT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-telegram_chats}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./apps
      dockerfile: migrator/Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  saver:
    build:
      context:
        ./apps
      dockerfile:
        ./saver/Dockerfile
    container_name: saver_app
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
    ports:
      - "8000:8000"
  command_service:
    build:
      context: ./apps
      dockerfile: command_service/Dockerfile
    container_name: command_app
    depends_on:
      db:
          condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
    ports: [ "8001:8001" ]
    #command: ["uvicorn","saver_app.main:saver_app","--host","0.0.0.0","--port","8000","--reload"]
    #command: uvicorn saver.src.saver_app.main:app --host 0.0.0.0 --port 8000 --reload

  tgbot:
    build:
      context:
        ./bot
      dockerfile:
        ./Dockerfile
    container_name: bot_app
    env_file: "tg.env"
    ports:
      - "6677"

  chroma:
    build:
      context:
        ./apps/chroma
      dockerfile:
        ./Dockerfile
    container_name:
      chroma-service
    ports:
      ["8082:8082"]

  summarizator:
    build:
      context:
        ./apps/summarization
      dockerfile:
        ./Dockerfile
    container_name:
      summarizator
    ports:
      ["8083:8083"]

  response-draft-generator:
    build:
      context:
        ./apps/response_draft_generator
      dockerfile:
        ./Dockerfile
    container_name:
      response-draft-generator
    ports:
      ["8084:8084"]

volumes:
  pgdata: {}
